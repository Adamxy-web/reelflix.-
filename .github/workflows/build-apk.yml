
name: Build REELFLIX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Instal SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Ekstrak proyek
        run: unzip REELFLIX_GitHub_Build.zip -d source

      - name: Bangun APK
        run: gradle -p source/REELFLIX_Android assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: REELFLIX-APK
          path: source/REELFLIX_Android/app/build/outputs/apk/debug/app-debug.apk
